  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:

        linear-gradient(135deg, #061410, #0b2119 50%, #03100c);
      color: #ffffff;
      overflow: hidden;
    }

    .container {
      width: 92%;
      max-width: 520px;
      text-align: center;
      padding: 42px 28px;
      border: 1px solid rgba(0, 255, 170, 0.3);
      border-radius: 24px;
      background: rgba(7, 25, 19, 0.88);
      box-shadow:
        0 0 45px rgba(0, 255, 170, 0.12),
        inset 0 0 30px rgba(0, 255, 170, 0.04);
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 105px;
      height: 105px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #00ffab, #00b878);
      box-shadow: 0 0 30px rgba(0, 255, 170, 0.35);
      color: #03130d;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -3px;
    }

    h1 {
      font-size: 38px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 14px;
      color: #ffffff;
    }

    .highlight {
      color: #00ffab;
    }

    .subtitle {
      color: #b8d8cb;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .features {
      display: grid;
      gap: 12px;
      margin-bottom: 28px;
      text-align: left;
    }

    .feature {
      padding: 13px 15px;
      border-radius: 12px;
      background: rgba(0, 255, 170, 0.06);
      border: 1px solid rgba(0, 255, 170, 0.13);
      color: #d9eee6;
      font-size: 14px;
    }

    .feature span {
      color: #00ffab;
      font-weight: 700;
      margin-right: 7px;
    }

    .telegram-btn {
      display: block;
      width: 100%;
      padding: 17px 22px;
      border-radius: 14px;
      background: linear-gradient(135deg, #00ffab, #00c982);
      color: #03130d;
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.3px;
      box-shadow: 0 10px 30px rgba(0, 255, 170, 0.2);
      transition: all 0.25s ease;
    }

    .telegram-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(0, 255, 170, 0.32);
    }

    .note {
      margin-top: 18px;
      color: #78988b;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 34px 20px;
      }

      h1 {
        font-size: 31px;
      }

      .logo {
        width: 90px;
        height: 90px;
